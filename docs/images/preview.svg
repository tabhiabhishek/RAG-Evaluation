    <line x1="774" y1="472" x2="774" y2="652"/>
    <line x1="886" y1="472" x2="886" y2="652"/>
    <line x1="1002" y1="472" x2="1002" y2="652"/>
    <line x1="1082" y1="472" x2="1082" y2="652"/>
