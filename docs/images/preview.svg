    <rect x="1102" y="568" width="28" height="24" rx="12" fill="#0f2a1c" stroke="#166534"/><text x="1116" y="585" fill="#4ade80">5</text>
    <rect x="1185" y="568" width="28" height="24" rx="12" fill="#0f2a1c" stroke="#166534"/><text x="1199" y="585" fill="#4ade80">5</text>

    <rect x="1028" y="616" width="28" height="24" rx="12" fill="#0f2a1c" stroke="#166534"/><text x="1042" y="633" fill="#4ade80">5</text>
    <rect x="1102" y="616" width="28" height="24" rx="12" fill="#2a1f0b" stroke="#92400e"/><text x="1116" y="633" fill="#fbbf24">3</text>
    <rect x="1185" y="616" width="28" height="24" rx="12" fill="#2a1414" stroke="#991b1b"/><text x="1199" y="633" fill="#f87171">1</text>
