    <text x="666" y="633">What is the speed…</text>
    <text x="784" y="633" fill="#9ca3af">The Earth revolv…</text>
    <text x="896" y="633">I don't know bas…</text>
  </g>
  <!-- score chips -->
  <g font-size="12" font-weight="700" text-anchor="middle">
    <rect x="1028" y="520" width="28" height="24" rx="12" fill="#0f2a1c" stroke="#166534"/><text x="1042" y="537" fill="#4ade80">5</text>
    <rect x="1102" y="520" width="28" height="24" rx="12" fill="#0f2a1c" stroke="#166534"/><text x="1116" y="537" fill="#4ade80">5</text>
