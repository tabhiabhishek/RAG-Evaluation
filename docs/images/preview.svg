    <text x="1116" y="495" text-anchor="middle">Relevance</text>
    <text x="1199" y="495" text-anchor="middle" font-size="10.5">Context Precision</text>
  </g>
  <g font-size="12" fill="#d1d5db">
    <text x="666" y="537">What is the capit…</text>
    <text x="784" y="537" fill="#9ca3af">Paris is the capit…</text>
    <text x="896" y="537">Paris</text>
